<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="Stack"><title>Stack</title><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease both}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.nudge{animation:nudge 1.8s ease-in-out infinite}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.25}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes sheen{0%,55%{transform:translateX(-500px)}100%{transform:translateX(1100px)}}
.tag{font-family:'Marker Felt','Permanent Marker','Comic Sans MS',cursive;font-weight:700}
.spray{animation:fade 1.2s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}
</style><defs><clipPath id="c"><rect x="4" y="4" width="872" height="56" rx="14"/></clipPath><filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .62 0 0 0 0 .6 0 0 0 1.6 -.95"/></filter><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter><radialGradient id="vig" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs><g clip-path="url(#c)"><rect x="4" y="4" width="872" height="56" fill="#0c0f10"/><g class="spray"><g transform="rotate(-3 680 44)" opacity="0.55" filter="url(#rough)"><text x="680" y="44" class="tag" font-size="22" fill="#a52a2a" stroke="#a52a2a" stroke-width="1.2">no tocar</text><path d="M720 46v6" stroke="#a52a2a" stroke-width="2.2" stroke-linecap="round"/><circle cx="720" cy="53" r="2.4" fill="#a52a2a"/></g></g><rect class="pulse" x="26" y="27" width="9" height="9" fill="#d97a35"/><g class="rise" style="animation-delay:0.10s"><text x="48" y="39" class="s" font-size="22" fill="#d9e1df" font-weight="700">Stack</text></g><rect x="4" y="4" width="872" height="56" filter="url(#noise)" opacity=".35"/><rect x="4" y="4" width="872" height="56" fill="url(#vig)"/></g><rect x="4.5" y="4.5" width="871" height="55" rx="13.5" fill="none" stroke="#262e31"/></svg>