ize="44" font-weight="800">APIs</tspan><tspan font-size="17" fill="#8a9e9c" dx="8">en tiempo real</tspan></text></g><g class="rise" style="animation-delay:0.35s"><text x="24" y="138" class="s" font-size="13.5" fill="#b9c6c4" >Servicios con FastAPI y PostgreSQL,</text></g><g class="rise" style="animation-delay:0.43s"><text x="24" y="160" class="s" font-size="13.5" fill="#b9c6c4" >WebSockets y despliegue con Docker.</text></g><rect x="4" y="4" width="432" height="204" filter="url(#noise)" opacity=".35"/><rect x="4" y="4" width="432" height="204" fill="url(#vig)"/></g><rect x="4.5" y="4.5" width="431" height="203" rx="13.5" fill="none" stroke="#262e31"/></svg>